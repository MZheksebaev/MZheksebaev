name: adilet-probe
on:
  push:
    branches: [claude/affectionate-ptolemy-acrw4e]
    paths: [".github/workflows/adilet-probe.yml", "zakony/tools/probe.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python zakony/tools/probe.py
